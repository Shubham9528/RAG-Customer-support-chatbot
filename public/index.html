<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Chat | AI Customer Assistant</title>
  <meta name="description" content="AI-powered customer support chatbot. Ask us anything about orders, returns, shipping, payments and more." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="avatar">🤖</div>
    <div class="header-info">
      <h1>Customer Support Assistant</h1>
      <div class="status">
        <span class="status-dot"></span>
        Online · Powered by RAG AI
      </div>
    </div>
    <span class="header-badge">RAG · Pinecone</span>
  </header>

  <!-- Chat Window -->
  <div id="chat-window">

    <!-- Welcome screen -->
    <div class="welcome" id="welcome-screen">
      <div class="welcome-icon">💬</div>
      <h2>Hi! How can I help you today?</h2>
      <p>Ask me anything about your orders, returns, shipping, payments, or account.</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion(this)">What is your return policy?</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">How do I track my order?</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">What payment methods do you accept?</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">How long does shipping take?</button>
      </div>
    </div>

  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="user-input"
        placeholder="Ask a question..."
        rows="1"
        autocomplete="off"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send" aria-label="Send message">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <p class="input-hint">Press <kbd style="background:var(--surface2);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:10px;">Enter</kbd> to send · <kbd style="background:var(--surface2);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:10px;">Shift+Enter</kbd> for new line</p>
  </div>

</div>

<script>
  const chatWindow = document.getElementById('chat-window');
  const input      = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Enter to send, Shift+Enter for newline
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendSuggestion(btn) {
    input.value = btn.textContent;
    sendMessage();
  }

  function appendMessage(role, text, sources = []) {
    // Remove welcome screen on first message
    const welcome = document.getElementById('welcome-screen');
    if (welcome) welcome.remove();

    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatarEmoji = role === 'user' ? '👤' : '🤖';

    let sourcesHtml = '';
    // if (sources.length > 0) {
    //   sourcesHtml = `<div class="sources">
    //     ${sources.map(s => `<span class="source-tag"></span>`).join('')}
    //   </div>`;
    // }

    msg.innerHTML = `
      <div class="msg-avatar">${avatarEmoji}</div>
      <div class="bubble">
        ${formatMessage(text)}
      </div>
    `;

    chatWindow.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'message bot';
    msg.id = 'typing';
    msg.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="typing-indicator">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    `;
    chatWindow.appendChild(msg);
    scrollToBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function scrollToBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function formatMessage(text) {
    // Process line by line for accurate bullet vs heading detection
    const lines = text.split('\n');
    const processedLines = lines.map(line => {
      // Line starting with * ** or - ** → bold heading (no bullet)
      if (/^\s*[\*\-]\s+\*\*/.test(line)) {
        // Strip the leading * or - marker, keep the rest (bold will be applied below)
        return line.replace(/^\s*[\*\-]\s+/, '');
      }
      // Line starting with * or - (plain bullet, no bold marker) → bullet dot
      if (/^\s*[\*\-]\s+/.test(line)) {
        return line.replace(/^\s*[\*\-]\s+/, '• ');
      }
      return line;
    });

    let html = escapeHtml(processedLines.join('\n'));

    // Convert **bold** to <strong>bold</strong>
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // Convert newlines to line breaks
    html = html.replace(/\n/g, '<br>');

    return html;
  }

  async function sendMessage() {
    const question = input.value.trim();
    if (!question) return;

    // Reset input
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    // Show user message
    appendMessage('user', question);

    // Show typing indicator
    showTyping();

    try {
      const res  = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      const data = await res.json();
      removeTyping();

      if (data.success) {
        appendMessage('bot', data.answer, data.sources || []);
      } else {
        appendMessage('bot', '⚠️ ' + (data.error || 'Something went wrong. Please try again.'));
      }
    } catch (err) {
      removeTyping();
      appendMessage('bot', '❌ Could not reach the server. Please make sure the chatbot is running.');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
