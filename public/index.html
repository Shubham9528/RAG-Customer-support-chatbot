<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Chat | AI Customer Assistant</title>
  <meta name="description" content="AI-powered customer support chatbot. Ask us anything about orders, returns, shipping, payments and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f4f6fa;
      --surface:     #ffffff;
      --surface2:    #f8fafc;
      --border:      #e2e8f0;
      --accent:      #4f46e5;
      --accent2:     #6366f1;
      --accent-glow: rgba(79, 70, 229, 0.15);
      --user-bg:     linear-gradient(135deg, #4f46e5, #6366f1);
      --bot-bg:      #ffffff;
      --text:        #0f172a;
      --muted:       #64748b;
      --success:     #10b981;
      --radius:      16px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1.5px solid #cbd5e1;
      border-right: 1.5px solid #cbd5e1;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.06);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    .avatar {
      width: 44px; height: 44px;
      background: var(--user-bg);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .header-info h1 {
      font-size: 16px; font-weight: 600; color: var(--text);
    }

    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--success);
    }

    .status-dot {
      width: 7px; height: 7px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }

    .header-badge {
      margin-left: auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ── Chat area ── */
    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat-window::-webkit-scrollbar { width: 4px; }
    #chat-window::-webkit-scrollbar-track { background: transparent; }
    #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Message ── */
    .message {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message.bot  .msg-avatar { background: var(--surface2); border: 1px solid var(--border); }
    .message.user .msg-avatar { background: var(--user-bg); }

    .bubble {
      max-width: 72%;
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
    }

    .message.bot  .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .message.user .bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    /* ── Source tag ── */
    .sources {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .source-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(108,99,255,0.12);
      border: 1px solid rgba(108,99,255,0.3);
      color: var(--accent2);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
    }

    /* ── Typing indicator ── */
    .typing-indicator {
      display: flex; align-items: center; gap: 5px;
      padding: 14px 18px;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .dot {
      width: 7px; height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-7px); background: var(--accent2); }
    }

    /* ── Welcome card ── */
    .welcome {
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
      padding: 40px 20px;
      gap: 14px;
    }

    .welcome-icon {
      width: 64px; height: 64px;
      background: var(--user-bg);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 32px var(--accent-glow);
      margin-bottom: 6px;
    }

    .welcome h2 { font-size: 20px; font-weight: 600; }
    .welcome p  { font-size: 13px; color: var(--muted); max-width: 380px; }

    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }

    .suggestion-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .suggestion-btn:hover {
      border-color: var(--accent);
      color: var(--accent2);
      background: rgba(108,99,255,0.1);
    }

    /* ── Input area ── */
    .input-area {
      padding: 18px 24px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }

    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 38px; height: 38px;
      background: var(--user-bg);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
    }

    #send-btn:hover  { opacity: 0.88; transform: scale(1.06); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    .input-hint {
      font-size: 11px; color: var(--muted);
      text-align: center;
      margin-top: 8px;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      #chat-window { padding: 16px; }
      .bubble      { max-width: 88%; }
      .input-area  { padding: 12px 16px 18px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="avatar">🤖</div>
    <div class="header-info">
      <h1>Customer Support Assistant</h1>
      <div class="status">
        <span class="status-dot"></span>
        Online · Powered by Gemini AI
      </div>
    </div>
    <span class="header-badge">RAG · Pinecone</span>
  </header>

  <!-- Chat Window -->
  <div id="chat-window">

    <!-- Welcome screen -->
    <div class="welcome" id="welcome-screen">
      <div class="welcome-icon">💬</div>
      <h2>Hi! How can I help you today?</h2>
      <p>Ask me anything about your orders, returns, shipping, payments, or account.</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion(this)">What is your return policy?</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">How do I track my order?</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">What payment methods do you accept?</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">How long does shipping take?</button>
      </div>
    </div>

  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="user-input"
        placeholder="Ask a question..."
        rows="1"
        autocomplete="off"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <p class="input-hint">Press <kbd style="background:var(--surface2);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:10px;">Enter</kbd> to send · <kbd style="background:var(--surface2);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:10px;">Shift+Enter</kbd> for new line</p>
  </div>

</div>

<script>
  const chatWindow = document.getElementById('chat-window');
  const input      = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Enter to send, Shift+Enter for newline
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendSuggestion(btn) {
    input.value = btn.textContent;
    sendMessage();
  }

  function appendMessage(role, text, sources = []) {
    // Remove welcome screen on first message
    const welcome = document.getElementById('welcome-screen');
    if (welcome) welcome.remove();

    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatarEmoji = role === 'user' ? '👤' : '🤖';

    let sourcesHtml = '';
    // if (sources.length > 0) {
    //   sourcesHtml = `<div class="sources">
    //     ${sources.map(s => `<span class="source-tag"></span>`).join('')}
    //   </div>`;
    // }

    msg.innerHTML = `
      <div class="msg-avatar">${avatarEmoji}</div>
      <div class="bubble">
        ${escapeHtml(text).replace(/\n/g, '<br>')}
        ${sourcesHtml}
      </div>
    `;

    chatWindow.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'message bot';
    msg.id = 'typing';
    msg.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="typing-indicator">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    `;
    chatWindow.appendChild(msg);
    scrollToBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function scrollToBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  async function sendMessage() {
    const question = input.value.trim();
    if (!question) return;

    // Reset input
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    // Show user message
    appendMessage('user', question);

    // Show typing indicator
    showTyping();

    try {
      const res  = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      const data = await res.json();
      removeTyping();

      if (data.success) {
        appendMessage('bot', data.answer, data.sources || []);
      } else {
        appendMessage('bot', '⚠️ ' + (data.error || 'Something went wrong. Please try again.'));
      }
    } catch (err) {
      removeTyping();
      appendMessage('bot', '❌ Could not reach the server. Please make sure the chatbot is running.');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
